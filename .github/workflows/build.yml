name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # tg-notify читает статус шагов

jobs:
  # Первая задача: создаёт сообщение в Telegram (остальные дописывают в него свои секции)
  # и проверяет версию из Resources/Info.plist (CFBundleShortVersionString). Выпустить одну версию
  # дважды нельзя, поэтому в PR в main и перед самим релизом проверяем, что такого релиза ещё нет.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      tg_message_id: ${{ steps.tg.outputs.message_id }}
    steps:
      # первым шагом: без секретов (например, в форке) только предупредит, сборку не уронит
      - id: tg
        uses: qu1nqqy/tg-notify@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ vars.TELEGRAM_TOPIC_ID }}

      - uses: actions/checkout@v4

      - name: Version is new
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          # в dev версию не поднимаем на каждый пуш — там только показываем её
          STRICT: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        run: |
          VERSION=$(python3 -c "import plistlib; print(plistlib.load(open('Resources/Info.plist', 'rb'))['CFBundleShortVersionString'])")
          TAG="v${VERSION}"
          if [ "$STRICT" = true ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Релиз $TAG уже выпущен — подними CFBundleShortVersionString в Resources/Info.plist"
            exit 1
          fi
          echo "Версия $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Логика без системных API: форматирование и тесты SoundwaveCore.
  test:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: qu1nqqy/tg-notify@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ vars.TELEGRAM_TOPIC_ID }}
          message_id: ${{ needs.version.outputs.tg_message_id }}

      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test

  # Приложение целиком: собирается и упаковывается в .app.
  app:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: qu1nqqy/tg-notify@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ vars.TELEGRAM_TOPIC_ID }}
          message_id: ${{ needs.version.outputs.tg_message_id }}

      - uses: actions/checkout@v4

      # в CI нет сертификата разработчика — подписываем ad-hoc
      - name: Build app
        run: make app SIGN_ID=-

      - name: Pack
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Soundwave.app dist/Soundwave.zip

      - uses: actions/upload-artifact@v4
        with:
          name: soundwave-mac-${{ github.sha }}
          path: dist/*

  release:
    needs: [test, app, version]
    # релизы только из main, пуши в dev и PR проходят лишь проверки
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      actions: read # свой блок permissions заменяет общий целиком
    steps:
      - uses: qu1nqqy/tg-notify@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ vars.TELEGRAM_TOPIC_ID }}
          message_id: ${{ needs.version.outputs.tg_message_id }}

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: soundwave-mac-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Soundwave $TAG" \
            --notes "Сборка коммита ${GITHUB_SHA}: $(git log -1 --pretty=%s)

          Установка: распаковать \`Soundwave.zip\` в /Applications. Сборка подписана ad-hoc, поэтому при
          первом запуске: правый клик → «Открыть»."

      # отдельное закреплённое сообщение о релизе с архивом приложения
      - uses: qu1nqqy/tg-notify@v1
        with:
          mode: release
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ vars.TELEGRAM_TOPIC_ID }}
          tag: ${{ needs.version.outputs.tag }}
          files: dist/*
