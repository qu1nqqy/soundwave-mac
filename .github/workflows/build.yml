name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Логика без системных API: форматирование и тесты SoundwaveCore.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test
