name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Логика без системных API: форматирование и тесты SoundwaveCore.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test

  # Приложение целиком: собирается и упаковывается в .app.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # в CI нет сертификата разработчика — подписываем ad-hoc
      - name: Build app
        run: make app SIGN_ID=-

      - name: Pack
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Soundwave.app dist/Soundwave.zip

      - uses: actions/upload-artifact@v4
        with:
          name: soundwave-mac-${{ github.sha }}
          path: dist/*

  release:
    needs: [test, app]
    # релизы только из main, пуши в dev и PR проходят лишь проверки
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: soundwave-mac-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "build-${SHORT_SHA}" dist/* \
            --target "$GITHUB_SHA" \
            --title "build ${SHORT_SHA}" \
            --notes "Сборка коммита ${GITHUB_SHA}: $(git log -1 --pretty=%s)

          Установка: распаковать \`Soundwave.zip\` в /Applications. Сборка подписана ad-hoc, поэтому при
          первом запуске: правый клик → «Открыть»."
